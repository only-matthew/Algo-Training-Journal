<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICPC 算法训练日志</title>
  <link rel="stylesheet" href="style.css?v=20260724-2" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
</head>
<body>
  <main class="container">
    <div id="auth-bar">
      <div class="auth-left">
        <span id="auth-status">未登录</span>
        <button id="btn-theme" class="btn-icon btn-theme" title="切换浅色/暗色模式">🌙</button>
      </div>
      <div class="auth-right">
        <button id="btn-refresh" class="btn btn-outline btn-sm-refresh" title="刷新数据">🔄 刷新</button>
        <button id="btn-submit" class="btn btn-primary" style="display:none">📝 提交/修改记录</button>
        <button id="btn-login" class="btn btn-outline">🔐 使用 GitHub 登录</button>
        <button id="btn-logout" class="btn btn-outline" style="display:none">退出</button>
      </div>
    </div>

    <nav class="page-nav" aria-label="页面导航">
      <button class="page-nav-btn active" type="button" data-page="overview-page">总览</button>
      <button class="page-nav-btn" type="button" data-page="analysis-page">训练分析</button>
    </nav>

    <section id="overview-page" class="page-view active">
      <header class="header">
      <div>
        <h1>ICPC 算法训练日志</h1>
        <p class="subtitle">记录每一次刷题，见证每一步前进</p>
      </div>
      <div class="filter">
        <label for="member-select">查看对象</label>
        <select id="member-select">
          <option value="all">全队</option>
        </select>
      </div>
      </header>

    <section class="grid metrics">
      <article class="card">
        <p class="metric-label">近 30 天训练题数</p>
        <p id="metric-total" class="metric-value">0</p>
      </article>
      <article class="card">
        <p class="metric-label">近 30 天训练天数</p>
        <p id="metric-days" class="metric-value">0</p>
      </article>
      <article class="card">
        <p class="metric-label">近 30 天周均频率</p>
        <p id="metric-weekly" class="metric-value">0</p>
      </article>
    </section>

    <section class="card">
      <h2>训练热力图（近 365 天）</h2>
      <p class="hint">颜色越深表示当日记录越多</p>
      <div id="heatmap" class="heatmap"></div>
    </section>

    <section class="grid stats">
      <article class="card">
        <h2>来源统计（近 30 天）</h2>
        <div id="platform-stats"></div>
      </article>
      <article class="card">
        <h2>难度统计（近 30 天，可选）</h2>
        <div id="difficulty-stats"></div>
      </article>
    </section>

    <section class="card">
      <h2>训练记录</h2>
      <p id="record-count" class="hint"></p>
      <div id="records" class="records"></div>
    </section>

      <footer class="footer">
        <p>数据每 5 分钟自动刷新 | 支持 LaTeX 数学公式（$...$ 和 $$...$$）</p>
      </footer>
    </section>

    <section id="analysis-page" class="page-view" hidden>
      <header class="header">
        <div>
          <h1>训练分析</h1>
          <p class="subtitle">按队员和时间范围查看训练情况</p>
        </div>
      </header>

      <section class="card analysis-controls">
        <div class="analysis-filter-row">
          <div class="form-group">
            <label for="analysis-member">队员</label>
            <select id="analysis-member" class="form-input">
              <option value="all">全队</option>
            </select>
          </div>
          <div class="form-group analysis-period">
            <label>训练时段</label>
            <div class="analysis-date-range">
              <div class="analysis-date-input">
                <input id="analysis-start" class="form-input" type="date" aria-label="开始日期" />
                <button type="button" class="analysis-calendar-trigger" data-date-target="analysis-start" aria-label="选择开始日期" title="选择开始日期">📅</button>
              </div>
              <span aria-hidden="true">至</span>
              <div class="analysis-date-input">
                <input id="analysis-end" class="form-input" type="date" aria-label="结束日期" />
                <button type="button" class="analysis-calendar-trigger" data-date-target="analysis-end" aria-label="选择结束日期" title="选择结束日期">📅</button>
              </div>
            </div>
            <div class="analysis-range-presets" role="group" aria-label="快捷时段">
              <button type="button" class="analysis-preset" data-range="today">今天</button>
              <button type="button" class="analysis-preset" data-range="week">近 7 天</button>
              <button type="button" class="analysis-preset" data-range="month">本月</button>
            </div>
          </div>
        </div>
      </section>

      <section class="grid metrics analysis-metrics">
        <article class="card">
          <p class="metric-label">训练题数</p>
          <p id="analysis-total" class="metric-value">0</p>
        </article>
        <article class="card">
          <p class="metric-label">训练天数</p>
          <p id="analysis-days" class="metric-value">0</p>
        </article>
        <article class="card">
          <p class="metric-label">涉及队员</p>
          <p id="analysis-members" class="metric-value">0</p>
        </article>
      </section>

      <section class="card">
        <h2>训练明细</h2>
        <p id="analysis-summary" class="hint"></p>
        <div id="analysis-records" class="records"></div>
      </section>
    </section>

    <!-- 提交模态框 -->
    <div id="submit-modal" class="modal-overlay" style="display:none">
      <div class="modal">
        <div class="modal-header">
          <h2>📝 提交训练记录</h2>
          <button id="btn-close-modal" class="btn-icon">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="submit-date">训练日期</label>
            <input type="date" id="submit-date" class="form-input" />
          </div>
          <div id="problem-list">
            <!-- 动态生成 -->
          </div>
          <button id="btn-add-problem" class="btn btn-outline btn-sm">＋ 添加一道题</button>
          <div class="modal-actions">
            <span id="submit-msg" class="submit-msg"></span>
            <div>
              <button id="btn-delete" class="btn btn-danger" style="display:none">🗑 删除记录</button>
              <button id="btn-save" class="btn btn-primary">提交到 GitHub</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <script src="app.js?v=20260724-2"></script>
</body>
</html>
