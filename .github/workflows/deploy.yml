name: Deploy Training Journal

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 需要历史：构建用 git log 回溯旧记录的 updatedAt，门禁还要 diff 本次推送范围。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check and generate site
        run: npm run check

      # Worker 只在自身输入变化时才需要重建。没变时线上 Worker 应保持原样，
      # 因此不做提交号校验、不等待；兼容性检查照常执行且立即失败。
      # WORKER_PATHS 必须与 Cloudflare Workers Builds 的 build watch paths 保持一致。
      - name: Detect Worker input changes
        id: worker
        env:
          WORKER_PATHS: workers lib config/members.json scripts/stamp-worker-commit.mjs package.json package-lock.json
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "Not a normal push (${{ github.event_name }}); checking compatibility only."
            echo "expected_commit=" >> "$GITHUB_OUTPUT"
            echo "wait_ms=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "Previous commit ${before:0:7} is not in this clone (history rewritten?); checking compatibility only."
            echo "expected_commit=" >> "$GITHUB_OUTPUT"
            echo "wait_ms=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$before" "${{ github.sha }}" -- $WORKER_PATHS; then
            echo "Worker inputs unchanged in ${before:0:7}..${{ github.sha }}; checking compatibility only."
            echo "expected_commit=" >> "$GITHUB_OUTPUT"
            echo "wait_ms=0" >> "$GITHUB_OUTPUT"
          else
            echo "Worker inputs changed in ${before:0:7}..${{ github.sha }}; will wait for a Worker build from this commit."
            echo "expected_commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "wait_ms=900000" >> "$GITHUB_OUTPUT"
          fi

      - name: Check live Worker compatibility
        env:
          WORKER_EXPECTED_COMMIT: ${{ steps.worker.outputs.expected_commit }}
          WORKER_WAIT_MS: ${{ steps.worker.outputs.wait_ms }}
        run: node scripts/check-worker-compatibility.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
