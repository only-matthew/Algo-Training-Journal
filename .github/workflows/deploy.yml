name: Deploy Training Journal

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      CDN_ORIGIN: https://cdn.mirstar.net
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 需要历史：构建用 git log 回溯旧记录的 updatedAt，门禁还要 diff 本次推送范围。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 只有确认 Worker 输入变化时才访问 Worker；其他发布完全跳过 Worker 门禁。
      # WORKER_PATHS 必须与 Cloudflare Workers Builds 的 build watch paths 保持一致。
      - name: Detect Worker input changes
        id: worker
        env:
          WORKER_PATHS: workers lib config/members.json scripts/stamp-worker-commit.mjs package.json package-lock.json
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "No push change range (${{ github.event_name }}); skipping Worker checks."
            echo "expected_commit=" >> "$GITHUB_OUTPUT"
            echo "wait_ms=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "Previous commit ${before:0:7} is unavailable; skipping Worker checks."
            echo "expected_commit=" >> "$GITHUB_OUTPUT"
            echo "wait_ms=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$before" "${{ github.sha }}" -- $WORKER_PATHS; then
            echo "Worker inputs unchanged in ${before:0:7}..${{ github.sha }}; skipping Worker checks."
            echo "expected_commit=" >> "$GITHUB_OUTPUT"
            echo "wait_ms=0" >> "$GITHUB_OUTPUT"
          else
            echo "Worker inputs changed in ${before:0:7}..${{ github.sha }}; will wait for a Worker build from this commit."
            echo "expected_commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "wait_ms=900000" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and build (Worker checks only when changed)
        env:
          WORKER_EXPECTED_COMMIT: ${{ steps.worker.outputs.expected_commit }}
          WORKER_WAIT_MS: ${{ steps.worker.outputs.wait_ms }}
        run: |
          if [ -z "$WORKER_EXPECTED_COMMIT" ]; then
            npm run verify:parallel
            exit 0
          fi
          # Worker 发布与本地验证同时进行；任一失败都不会上传站点。
          node scripts/check-worker-compatibility.mjs &
          worker_gate_pid=$!
          trap 'kill "$worker_gate_pid" 2>/dev/null || true' EXIT
          npm run verify:parallel
          wait "$worker_gate_pid"
          trap - EXIT

      - name: Preserve test diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-diagnostics
          path: artifacts/unit-tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
