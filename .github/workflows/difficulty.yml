name: Complete Missing Difficulties

on:
  schedule:
    # 每天 03:30（北京时间）重试尚未补到官方难度的题目。
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: difficulty-enrichment
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Complete missing difficulties
        run: npm run sync:difficulty

      - name: Refresh training indexes
        run: npm run training:reindex

      - name: Commit resolved difficulties and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- 'logs/**/meta.json' 'training/members/*/indexes/legacy.json'
          if git diff --cached --quiet; then
            echo "No new difficulties were resolved."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update missing official problem difficulties"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
          gh workflow run deploy.yml --ref "$TARGET_BRANCH"
