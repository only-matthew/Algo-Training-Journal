name: Quality Checks

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source and build site
        run: npm run verify:parallel

      - name: Preserve test diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-diagnostics
          path: artifacts/unit-tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Detect Worker input changes
        id: worker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && ! git diff --quiet "$BASE_SHA" HEAD -- workers lib config/members.json scripts/stamp-worker-commit.mjs package.json package-lock.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Worker bundling (only when changed)
        if: steps.worker.outputs.changed == 'true'
        run: npx wrangler deploy --dry-run --outdir .build-cache/worker-dryrun --config workers/wrangler.toml
