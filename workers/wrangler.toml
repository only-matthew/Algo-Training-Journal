name = "algo-oauth"
main = "oauth.mjs"

compatibility_date = "2026-07-25"
workers_dev = false
preview_urls = false

# 使用 `npx wrangler secret put` 配置：
# GITHUB_CLIENT_ID、GITHUB_CLIENT_SECRET、SESSION_SECRET（至少 32 字节随机值）
# QQ_APP_ID、QQ_CLIENT_SECRET、QQ_BOT_SECRET（QQ 机器人 Webhook 用，见 workers/qq-bot.mjs）
# 第三方 LLM 密钥也必须通过 Worker Secret 或 AI Gateway BYOK 配置，不得写入前端或本文件。

[vars]
QQ_DATA_URL = "https://train.xialiao.org"
QQ_BOT_NAME = ""
# QQ 机器人 AI 指令：默认 OpenAI 兼容端点（如 DeepSeek）。API key 请用
# `npx wrangler secret put QQ_LLM_API_KEY` 配置（不写入本文件）；未配置时回退 Workers AI。
QQ_LLM_BASE_URL = "https://api.deepseek.com"
QQ_LLM_MODEL = "deepseek-v4-flash"

[[routes]]
pattern = "algo-oauth.xialiao.org"
custom_domain = true

[ai]
binding = "AI"

[observability]
enabled = true
