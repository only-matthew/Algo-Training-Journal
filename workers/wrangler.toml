name = "algo-oauth"
main = "oauth.js"

compatibility_date = "2026-07-25"

# 使用 `npx wrangler secret put` 配置：
# GITHUB_CLIENT_ID、GITHUB_CLIENT_SECRET、SESSION_SECRET（至少 32 字节随机值）

# 如果你有自己的域名路由，部署后取消下面的注释并设置路由
# routes = [
#   { pattern = "oauth.train.xialiao.org", zone_id = "YOUR_ZONE_ID" }
# ]

[observability]
enabled = true